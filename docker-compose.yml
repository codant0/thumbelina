version: "3.8"
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./thumbelina.yaml:/app/thumbelina.yaml:ro
      - thumbelina-data:/app/data
    environment:
      - THUMBELINA_LLM__API_KEY=${THUMBELINA_LLM__API_KEY}

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  thumbelina-data:
