[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thumbelina"
version = "0.1.0"
description = "AI-powered application built with FastAPI and LangGraph"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.3",
    "langchain-ollama>=0.2",
    "chromadb>=0.5",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "click>=8.0",
    "prompt_toolkit>=3.0",
    "dateparser>=1.2",
    "PyJWT>=2.8",
    "httpx>=0.27",
    "llama-index-core>=0.14.23",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.12",
]
rag = [
    "llama-index-embeddings-huggingface>=0.5",
    "llama-index-llms-openai-like>=0.3",
    "sqlite-vec>=0.1",
    "datasketch>=1.6",
    "pymupdf>=1.24",
    "simhash>=2.1",
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "markdown-it-py>=3.0",
]
rag-ocr = [
    "paddlepaddle>=3.0",
    "paddleocr>=3.0",
    "numpy>=1.26",
]

[project.scripts]
thumb = "thumbelina.cli.main:cli"
thumbelina = "thumbelina.cli.main:cli"
thumbelina-serve = "thumbelina.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/thumbelina"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["thumbelina"]
mypy_path = "src"
